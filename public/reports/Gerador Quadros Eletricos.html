    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .form-section {
            background-color: #ffffff;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .form-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111827;
            border-bottom: 1px solid #d1d5db;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 0.5rem;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f9fafb;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        /* Estilos do Relatório Gerado */
        .report-page-container {
            width: 100%;
            max-width: 210mm;
            /* A4 width */
            margin: 1rem auto;
            page-break-after: always;
        }

        .report-page-container:last-of-type {
            page-break-after: auto;
        }

        .report-page {
            background: white;
            width: 100%;
            aspect-ratio: 210 / 297;
            /* A4 aspect ratio */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #e5e7eb;
            font-size: 11pt;
        }

        .report-header,
        .report-footer {
            padding: 8mm 10mm;
            flex-shrink: 0;
        }

        .report-header {
            border-bottom: 1px solid #d1d5db;
        }

        .report-footer {
            margin-top: auto;
            padding: 6mm 10mm;
            flex-shrink: 0;
        }

        .report-content {
            flex-grow: 1;
            padding: 10mm;
            overflow: hidden;
        }

        .report-section-title {
            font-size: 1.2em;
            font-weight: 700;
            color: #111827;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .report-content p,
        .report-content li {
            text-align: justify;
            line-height: 1.6;
        }

        .report-content table {
            width: 100%;
            font-size: 0.9em;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .report-content th,
        .report-content td {
            border: 1px solid #d1d5db;
            padding: 6px 8px;
            text-align: left;
            vertical-align: top;
        }

        .report-content th {
            background-color: #f3f4f6;
            font-weight: 600;
        }

        @media print {
            body {
                background-color: #fff;
            }

            .no-print {
                display: none !important;
            }

            #reportOutputContainer {
                padding: 0;
            }

            .report-page-container {
                margin: 0;
                box-shadow: none;
                border: none;
            }

            .report-page {
                width: 210mm;
                height: 297mm;
                aspect-ratio: unset;
                box-shadow: none;
                border: none;
                font-size: 11pt;
            }
        }

        /* --- Patch de Responsividade --- */
        @media (max-width: 1024px) {

            .topbar-inner,
            .cover-top,
            .doc-head {
                flex-direction: column !important;
                display: flex !important;
                gap: 15px !important;
                text-align: center !important;
                padding: 20px !important;
                height: auto !important;
                grid-template-columns: 1fr !important;
            }

            .brand,
            .actions,
            .tabs {
                width: 100% !important;
                justify-content: center !important;
                min-width: unset !important;
            }

            .tabs {
                overflow-x: auto;
                padding: 10px 0;
            }

            .grid,
            .row,
            .row-3,
            .equip-details-grid,
            .grid-cols-2,
            .grid-cols-3,
            .grid-cols-4 {
                grid-template-columns: 1fr !important;
            }

            .wrap,
            .max-w-7xl,
            .max-w-5xl,
            .report-page-container {
                padding: 10px !important;
            }

            .meta-strip {
                grid-template-columns: 1fr 1fr !important;
                display: grid !important;
            }

            .meta-strip .m {
                border-right: none !important;
                border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            }
        }

        @media (max-width: 640px) {
            .meta-strip {
                grid-template-columns: 1fr !important;
            }

            .sheet,
            .report-page {
                width: 210mm !important;
            }

            #reportOutput,
            #previewPane,
            .preview-shell {
                overflow-x: auto !important;
                display: block !important;
                -webkit-overflow-scrolling: touch;
            }

            .cover-mid h1 {
                font-size: 20pt !important;
            }
        }
    </style>
    <script>
        // Protecao Anti-Copia ChameiApp
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) {
                e.preventDefault();
                return false;
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const { jsPDF } = window.jspdf;

            // --- Elementos do DOM ---
            const reportForm = document.getElementById('reportForm');
            const reportOutput = document.getElementById('reportOutput');
            const downloadPdfBtn = document.getElementById('downloadPdfBtn');
            const addVisualItemBtn = document.getElementById('addVisualItemBtn');
            const visualItemsContainer = document.getElementById('visualItemsContainer');
            const visualItemTemplate = document.getElementById('visualItemTemplate');
            const addPhotoBtn = document.getElementById('addPhotoBtn');
            const photosContainer = document.getElementById('photosContainer');
            const photoTemplate = document.getElementById('photoTemplate');
            const statusMessage = document.getElementById('statusMessage');
            let debounceTimer;

            // --- Funções ---

            function addVisualItem(data = {}) {
                const { description = '', status = 'Conforme', reason = '' } = data;
                const templateContent = visualItemTemplate.content.cloneNode(true);
                const visualItem = templateContent.querySelector('.visual-item');
                const statusSelect = visualItem.querySelector('.item-status');
                const reasonContainer = visualItem.querySelector('.reason-container');
                const reasonTextarea = visualItem.querySelector('.item-reason');
                const removeBtn = visualItem.querySelector('.remove-visual-item-btn');

                visualItem.querySelector('.item-description').value = description;
                statusSelect.value = status;
                reasonTextarea.value = reason;

                const toggleReasonField = () => {
                    if (statusSelect.value === 'Não Conforme') {
                        reasonContainer.classList.remove('hidden');
                    } else {
                        reasonContainer.classList.add('hidden');
                    }
                };

                statusSelect.addEventListener('change', toggleReasonField);
                removeBtn.addEventListener('click', () => {
                    visualItem.remove();
                    updateAndRender();
                });

                toggleReasonField();

                visualItemsContainer.appendChild(visualItem);
            }

            function addPhoto(data = null) {
                const templateContent = photoTemplate.content.cloneNode(true);
                const photoItem = templateContent.querySelector('.photo-item');
                const fileInput = photoItem.querySelector('.photo-file');
                const imgPreview = photoItem.querySelector('img');
                const removeBtn = photoItem.querySelector('.remove-photo-btn');
                const descriptionInput = photoItem.querySelector('.photo-description');

                if (data) {
                    descriptionInput.value = data.description || '';
                    if (data.src) {
                        imgPreview.src = data.src;
                        imgPreview.classList.remove('hidden');
                        imgPreview.dataset.loadedSrc = data.src;
                    }
                }

                fileInput.addEventListener('change', () => {
                    const file = fileInput.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            imgPreview.src = e.target.result;
                            imgPreview.dataset.loadedSrc = e.target.result;
                            imgPreview.classList.remove('hidden');
                        };
                        reader.readAsDataURL(file);
                    }
                });

                removeBtn.addEventListener('click', () => {
                    photoItem.remove();
                    updateAndRender();
                });

                photosContainer.appendChild(photoItem);
            }

            async function fileToDataURL(file) {
                return new Promise((resolve) => {
                    if (!file) { resolve(null); return; }
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(file);
                });
            }

            async function pdfToDataURLs(file) {
                return new Promise(async (resolve) => {
                    if (!file) { resolve([]); return; }
                    const fileReader = new FileReader();
                    fileReader.onload = async function () {
                        try {
                            const typedarray = new Uint8Array(this.result);
                            const pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                            const pageDataUrls = [];
                            for (let i = 1; i <= pdfDoc.numPages; i++) {
                                const page = await pdfDoc.getPage(i);
                                const viewport = page.getViewport({ scale: 2.0 });
                                const canvas = document.createElement('canvas');
                                const context = canvas.getContext('2d');
                                canvas.height = viewport.height;
                                canvas.width = viewport.width;
                                await page.render({ canvasContext: context, viewport: viewport }).promise;
                                pageDataUrls.push(canvas.toDataURL('image/png'));
                            }
                            resolve(pageDataUrls);
                        } catch (error) {
                            console.error("Erro ao processar PDF:", error);
                            resolve([]);
                        }
                    };
                    fileReader.readAsArrayBuffer(file);
                });
            }

            async function processFile(file) {
                if (!file) return [];
                if (file.type.startsWith('image/')) {
                    const dataUrl = await fileToDataURL(file);
                    return dataUrl ? [dataUrl] : [];
                }
                if (file.type === 'application/pdf') {
                    return pdfToDataURLs(file);
                }
                return [];
            }

            async function getFormData(forSave = false) {
                const data = {};
                [
                    'clientName', 'clientAddress', 'reportTitle', 'reportNumber', 'reportDate',
                    'introText', 'objectiveText', 'methodologyText', 'finalConclusion', 'closingRemarks',
                    'engineerName', 'creaNumber', 'signatureCity', 'signatureDate',
                    'companyName', 'companyAddress', 'companyPhone', 'companyEmail'
                ].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) data[id] = el.value;
                });

                const companyLogoInput = document.getElementById('companyLogo');
                data.companyLogoUrl = forSave ? (companyLogoInput.files[0] ? await fileToDataURL(companyLogoInput.files[0]) : companyLogoInput.__src) : (companyLogoInput.__src || await fileToDataURL(companyLogoInput.files[0]));

                const engineerSignatureInput = document.getElementById('engineerSignature');
                data.engineerSignatureUrl = forSave ? (engineerSignatureInput.files[0] ? await fileToDataURL(engineerSignatureInput.files[0]) : engineerSignatureInput.__src) : (engineerSignatureInput.__src || await fileToDataURL(engineerSignatureInput.files[0]));

                const artPdfInput = document.getElementById('artPdf');
                data.artUrls = forSave ? (artPdfInput.files[0] ? await processFile(artPdfInput.files[0]) : artPdfInput.__src) : (artPdfInput.__src || await processFile(artPdfInput.files[0]));


                data.visualItems = Array.from(document.querySelectorAll('.visual-item')).map(item => ({
                    description: item.querySelector('.item-description').value,
                    status: item.querySelector('.item-status').value,
                    reason: item.querySelector('.item-reason').value
                }));

                data.photos = [];
                const photoItems = document.querySelectorAll('.photo-item');
                for (const item of photoItems) {
                    const fileInput = item.querySelector('.photo-file');
                    const imgPreview = item.querySelector('img');
                    data.photos.push({
                        description: item.querySelector('.photo-description').value,
                        src: forSave ? (fileInput.files[0] ? await fileToDataURL(fileInput.files[0]) : imgPreview.dataset.loadedSrc) : (imgPreview.dataset.loadedSrc || await fileToDataURL(fileInput.files[0]))
                    });
                }
                return data;
            }

            function createReportPages(data) {
                const pages = [];
                let currentPage = 1;

                // --- Página 1: Capa ---
                const coverPage = document.createElement('div');
                coverPage.className = 'report-page-container';
                coverPage.innerHTML = `
                <div class="report-page flex flex-col justify-between text-center p-10">
                    <div class="flex-shrink-0">
                        <img src="${data.companyLogoUrl || 'https://placehold.co/400x150/f0f0f0/CCCCCC?text=Sua+Empresa'}" alt="Logo da Empresa" class="h-32 mx-auto mb-16 object-contain">
                    </div>
                    <div class="flex-grow flex flex-col justify-center items-center">
                        <h1 class="text-2xl font-bold">${data.reportTitle}</h1>
                    </div>
                    <div class="flex-shrink-0 mt-16">
                        <p class="text-xl font-semibold">${data.clientName}</p>
                        <p class="text-md mt-2">${new Date(data.reportDate + 'T00:00:00').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase()}</p>
                    </div>
                </div>`;
                pages.push(coverPage);

                // --- Página 2: Textos Introdutórios ---
                const introPage = document.createElement('div');
                introPage.className = 'report-page-container';
                const introTextWithClient = data.introText.replace(/\[CLIENTE\]/g, `<strong>${data.clientName}</strong>`);
                const objectiveTextWithClient = data.objectiveText.replace(/\[CLIENTE\]/g, `<strong>${data.clientName}</strong>`).replace(/\[ENDERECO\]/g, `<strong>${data.clientAddress}</strong>`);

                introPage.innerHTML = `
                <div class="report-page">
                    ${createHeader(data, currentPage++)}
                    <div class="report-content">
                        <h3 class="report-section-title">1. INTRODUÇãO</h3>
                        <p>${introTextWithClient}</p>
                        <h3 class="report-section-title">2. OBJETIVO</h3>
                        <p>${objectiveTextWithClient}</p>
                        <h3 class="report-section-title">3. NORMAS E DOCUMENTOS COMPLEMENTARES</h3>
                        <ul class="list-disc list-inside space-y-1 text-sm">
                            <li>NBR 5410 - Instalações elétricas de baixa tensão.</li>
                            <li>NBR 5419 - Proteção de estruturas contra descargas atmosféricas.</li>
                            <li>NBR 14039 - Instalações elétricas de média tensão de 1,0 kV a 36,2 kV.</li>
                            <li>NR 10 - Instalações e Serviços em Eletricidade.</li>
                        </ul>
                        <h3 class="report-section-title">4. METODOLOGIA</h3>
                        <p>${data.methodologyText}</p>
                    </div>
                    ${createFooter(data)}
                </div>`;
                pages.push(introPage);

                // --- Página 3: Itens Inspecionados ---
                const visualResultsPage = document.createElement('div');
                visualResultsPage.className = 'report-page-container';
                visualResultsPage.innerHTML = `
                <div class="report-page">
                    ${createHeader(data, currentPage++)}
                    <div class="report-content">
                        <h3 class="report-section-title">5. ITENS INSPECIONADOS</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Item Verificado</th>
                                    <th style="width: 120px;">Resultado</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.visualItems.map(item => `
                                    <tr>
                                        <td>
                                            ${item.description}
                                            ${item.status === 'Não Conforme' && item.reason ? `<br><small style="color: #c53030; font-style: italic;"><strong>Obs:</strong> ${item.reason}</small>` : ''}
                                        </td>
                                        <td>${item.status}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    ${createFooter(data)}
                </div>`;
                pages.push(visualResultsPage);

                // --- Páginas de Anexos Fotográficos ---
                const photos = data.photos.filter(p => p.src);
                for (let i = 0; i < photos.length; i += 4) {
                    const photoChunk = photos.slice(i, i + 4);
                    const photoPage = document.createElement('div');
                    photoPage.className = 'report-page-container';

                    let photoGridHtml = '<div class="grid grid-cols-2 gap-4">';
                    photoChunk.forEach(photo => {
                        photoGridHtml += `
                        <div class="border p-1 rounded-md shadow-sm flex flex-col">
                            <img src="${photo.src}" class="w-full h-40 object-cover rounded-sm">
                            <p class="text-center text-xs italic mt-1 p-1">${photo.description || ''}</p>
                        </div>
                    `;
                    });
                    photoGridHtml += '</div>';

                    photoPage.innerHTML = `
                    <div class="report-page">
                        ${createHeader(data, currentPage++)}
                        <div class="report-content">
                            <h3 class="report-section-title">6. ANEXO FOTOGRÃFICO</h3>
                            ${photoGridHtml}
                        </div>
                        ${createFooter(data)}
                    </div>`;
                    pages.push(photoPage);
                }

                // --- Páginas da ART ---
                if (data.artUrls && data.artUrls.length > 0) {
                    data.artUrls.forEach((url, index) => {
                        const artPage = document.createElement('div');
                        artPage.className = 'report-page-container';
                        artPage.innerHTML = `
                    <div class="report-page">
                        ${createHeader(data, currentPage++)}
                        <div class="report-content">
                            <h3 class="report-section-title">7. ANEXO - ART</h3>
                             <img src="${url}" class="w-full h-auto object-contain border rounded-md shadow-sm mt-4" style="max-height: 220mm;">
                        </div>
                        ${createFooter(data)}
                    </div>`;
                        pages.push(artPage);
                    });
                }

                // --- Página Final: Conclusão ---
                const conclusionPage = document.createElement('div');
                conclusionPage.className = 'report-page-container';
                const finalClosingRemarks = data.closingRemarks.replace('[NÃšMERO]', currentPage);
                conclusionPage.innerHTML = `
                <div class="report-page">
                    ${createHeader(data, currentPage)}
                    <div class="report-content">
                        <h3 class="report-section-title">CONCLUSãO</h3>
                        <p>${data.finalConclusion}</p>
                        <p class="mt-4 text-sm">${finalClosingRemarks}</p>
                        <div class="mt-auto pt-12 text-center">
                            <div class="inline-flex flex-col items-center">
                                <img src="${data.engineerSignatureUrl || 'https://placehold.co/200x80/f0f0f0/CCCCCC?text=Assinatura'}" alt="Assinatura" class="h-24 mx-auto mb-2 object-contain">
                                <p class="border-t border-slate-400 pt-2 mt-2 px-12">${data.engineerName}</p>
                                <p class="text-sm">Responsável Técnico</p>
                                <p class="text-sm font-bold">CREA: ${data.creaNumber}</p>
                            </div>
                            <p class="text-center mt-8 text-sm">${data.signatureCity}, ${new Date(data.signatureDate + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })}.</p>
                        </div>
                    </div>
                    ${createFooter(data)}
                </div>`;
                pages.push(conclusionPage);

                return pages;
            }

            function createHeader(data, pageNumber) {
                return `
                <div class="report-header text-[9px]">
                    <table class="w-full border-2 border-gray-800">
                        <tbody>
                            <tr>
                                <td class="w-1/4 p-2 border-r-2 border-gray-800 align-middle text-center" rowspan="4">
                                    <img src="${data.companyLogoUrl || 'https://placehold.co/200x80/f0f0f0/CCCCCC?text=Logo'}" class="max-h-16 object-contain inline-block">
                                </td>
                                <td class="p-1 text-center font-bold" colspan="2">${data.reportTitle}</td>
                            </tr>
                            <tr>
                                <td class="p-1 border-t-2 border-gray-800" colspan="2"><strong>CLIENTE:</strong> ${data.clientName}</td>
                            </tr>
                            <tr>
                                <td class="p-1 border-t-2 border-gray-800" colspan="2"><strong>ENDEREÇO:</strong> ${data.clientAddress}</td>
                            </tr>
                            <tr>
                                <td class="p-1 border-t-2 border-gray-800"><strong>NÂº RELATÓRIO:</strong> ${data.reportNumber}</td>
                                <td class="p-1 border-t-2 border-l-2 border-gray-800"><strong>DATA:</strong> ${new Date(data.reportDate + 'T00:00:00').toLocaleDateString('pt-BR')} | <strong>PÃGINA:</strong> ${pageNumber}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>`;
            }

            function createFooter(data) {
                const phoneIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 inline-block mr-1.5" viewBox="0 0 20 20" fill="currentColor"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path></svg>`;
                const emailIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 inline-block mr-1.5" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path></svg>`;
                const addressIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 inline-block mr-1.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>`;

                return `
                <div class="report-footer text-[8pt] text-gray-600">
                    <div class="w-full h-0.5 bg-gray-300 mb-3"></div>
                    <div class="flex justify-between items-start">
                        <div class="w-1/2 pr-4">
                            <p class="font-bold text-gray-800 text-[9pt]">${data.companyName}</p>
                            <p class="mt-1 flex items-start">${addressIcon} <span class="ml-1">${data.companyAddress}</span></p>
                        </div>
                        <div class="w-1/2 text-right">
                            <p class="flex items-center justify-end">${phoneIcon} ${data.companyPhone}</p>
                            <p class="mt-1 flex items-center justify-end">${emailIcon} ${data.companyEmail}</p>
                        </div>
                    </div>
                </div>`;
            }

            async function updateAndRender() {
                const formData = await getFormData();
                const pages = createReportPages(formData);
                reportOutput.innerHTML = '';
                pages.forEach(page => reportOutput.appendChild(page));
            }

            async function downloadPDF() {
                const downloadBtnText = document.getElementById('downloadBtnText');
                const originalText = downloadBtnText.textContent;
                downloadPdfBtn.disabled = true;
                downloadBtnText.textContent = 'Processando...';

                const pages = reportOutput.querySelectorAll('.report-page-container');
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = 210;
                const pdfHeight = 297;

                for (let i = 0; i < pages.length; i++) {
                    const page = pages[i];
                    try {
                        const canvas = await html2canvas(page, { scale: 3, useCORS: true, logging: false });
                        if (i > 0) pdf.addPage();
                        const imgData = canvas.toDataURL('image/jpeg', 0.85);
                        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                    } catch (error) {
                        console.error(`Erro ao renderizar a página ${i + 1}:`, error);
                        alert(`Ocorreu um erro ao gerar o PDF na página ${i + 1}. Verifique o console para mais detalhes.`);
                        downloadPdfBtn.disabled = false;
                        downloadBtnText.textContent = originalText;
                        return;
                    }
                }

                const reportNumber = document.getElementById('reportNumber').value || 'relatorio-manutencao';
                pdf.save(`${reportNumber}.pdf`);
                downloadPdfBtn.disabled = false;
                downloadBtnText.textContent = originalText;
            }

            function showStatus(message, isSuccess = true) {
                const statusMessage = document.getElementById('statusMessage');
                statusMessage.textContent = message;
                statusMessage.className = `text-center mb-4 h-6 ${isSuccess ? 'text-green-600' : 'text-red-600'}`;
                setTimeout(() => {
                    statusMessage.textContent = '';
                }, 3000);
            }

            async function saveDataToFile() {
                try {
                    const dataToSave = await getFormData(true);
                    const dataString = JSON.stringify(dataToSave, null, 2);
                    const blob = new Blob([dataString], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const reportNumber = document.getElementById('reportNumber').value || 'dados-relatorio-manutencao';
                    a.href = url;
                    a.download = `${reportNumber}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showStatus('Dados baixados com sucesso!', true);
                } catch (error) {
                    console.error("Erro ao baixar dados:", error);
                    showStatus('Falha ao baixar os dados.', false);
                }
            }

            function populateForm(data) {
                clearForm(false);

                Object.keys(data).forEach(key => {
                    const el = document.getElementById(key);
                    if (el && typeof data[key] === 'string' && !el.type.startsWith('file')) {
                        el.value = data[key];
                    }
                });

                if (data.companyLogoUrl) document.getElementById('companyLogo').__src = data.companyLogoUrl;
                if (data.engineerSignatureUrl) document.getElementById('engineerSignature').__src = data.engineerSignatureUrl;
                if (data.artUrls) document.getElementById('artPdf').__src = data.artUrls;

                if (data.visualItems && Array.isArray(data.visualItems)) {
                    data.visualItems.forEach(itemData => addVisualItem(itemData));
                }
                if (data.photos && Array.isArray(data.photos)) {
                    data.photos.forEach(photoData => addPhoto(photoData));
                }

                showStatus('Dados importados com sucesso!', true);
                updateAndRender();
            }

            function handleFileImport(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        populateForm(data);
                    } catch (error) {
                        console.error("Erro ao ler o arquivo JSON:", error);
                        showStatus('Arquivo inválido. Selecione um arquivo JSON gerado por esta aplicação.', false);
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            }

            function addInitialItems() {
                const initialItems = ["Limpeza geral do painel", "Reaperto de conexões", "Verificação de componentes", "Identificação de circuitos"];
                initialItems.forEach(item => addVisualItem({ description: item }));
                addPhoto();
                document.getElementById('reportDate').valueAsDate = new Date();
                document.getElementById('signatureDate').valueAsDate = new Date();
            }

            function clearForm(confirmFirst = true) {
                if (confirmFirst && !confirm('Tem certeza que deseja limpar todo o formulário?')) {
                    return;
                }
                reportForm.reset();
                visualItemsContainer.innerHTML = '';
                photosContainer.innerHTML = '';

                // Limpa __src dos inputs de arquivo
                document.querySelectorAll('input[type="file"]').forEach(input => input.__src = null);

                addInitialItems();

                updateAndRender();
                if (confirmFirst) {
                    showStatus('Formulário limpo.', true);
                }
            }

            // --- Inicialização do script ---
            addInitialItems();
            updateAndRender();

            // --- Event Listeners ---
            reportForm.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(updateAndRender, 500);
            });
            reportForm.addEventListener('change', updateAndRender);
            addVisualItemBtn.addEventListener('click', () => addVisualItem());
            addPhotoBtn.addEventListener('click', () => addPhoto());
            downloadPdfBtn.addEventListener('click', downloadPDF);

            // Novos Listeners para Importar/Exportar
            const saveFileBtn = document.createElement('button');
            saveFileBtn.id = 'saveFileBtn'; // para compatibilidade com a busca
            const importFileBtn = document.createElement('button');
            importFileBtn.id = 'importFileBtn';
            const importFileInput = document.createElement('input');
            importFileInput.id = 'importFileInput';

            const actionsContainer = document.querySelector('.form-section .flex.gap-2.flex-wrap');
            if (actionsContainer) {
                actionsContainer.innerHTML = `
                <button type="button" id="importFileBtn" class="bg-teal-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-teal-700 transition-colors">Importar Dados</button>
                <button type="button" id="saveFileBtn" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700 transition-colors">Baixar Dados</button>
                <input type="file" id="importFileInput" class="hidden" accept=".json,.txt">
                <button type="button" id="clearFormBtnNew" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-700 transition-colors">Limpar</button>
            `;
                document.getElementById('saveFileBtn').addEventListener('click', saveDataToFile);
                document.getElementById('importFileBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
                document.getElementById('importFileInput').addEventListener('change', handleFileImport);
                document.getElementById('clearFormBtnNew').addEventListener('click', () => clearForm(true));
            }

            // --- Sincronização de Rolagem ---
            const formScroller = document.getElementById('formContainer');
            const previewScroller = document.getElementById('reportOutput');

            formScroller.addEventListener('scroll', () => {
                const formScrollableHeight = formScroller.scrollHeight - formScroller.clientHeight;
                if (formScrollableHeight <= 0) return;

                const scrollPercent = formScroller.scrollTop / formScrollableHeight;
                const previewScrollableHeight = previewScroller.scrollHeight - previewScroller.clientHeight;

                previewScroller.scrollTop = scrollPercent * previewScrollableHeight;
            });
        });
    </script>
</body>

</html>
