    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- Constantes e Elementos do DOM ---
            const { jsPDF } = window.jspdf;
            const STORAGE_KEY = 'reportFormData';
            const formElements = {
                reportForm: document.getElementById('reportForm'),
                formContainer: document.getElementById('formContainer'),
                reportOutputContainer: document.getElementById('reportOutputContainer'),
                reportOutput: document.getElementById('reportOutput'),
                newReportBtn: document.getElementById('newReportBtn'),
                editReportBtn: document.getElementById('editReportBtn'),
                downloadPdfBtn: document.getElementById('downloadPdfBtn'),
                generateBtn: document.getElementById('generateBtn'),
                saveBtn: document.getElementById('saveBtn'),
                loadBtn: document.getElementById('loadBtn'),
                photosInput: document.getElementById('photos'),
                cameraBtn: document.getElementById('cameraBtn'),
                photoPreviews: document.getElementById('photo-previews'),
                cameraModal: document.getElementById('cameraModal'),
                cameraFeed: document.getElementById('cameraFeed'),
                captureBtn: document.getElementById('captureBtn'),
                closeCameraBtn: document.getElementById('closeCameraBtn'),
                notification: document.getElementById('notification'),
                notificationMessage: document.getElementById('notificationMessage'),
                confirmModal: document.getElementById('confirmModal'),
                confirmMessage: document.getElementById('confirmMessage'),
                confirmOkBtn: document.getElementById('confirmOkBtn'),
                confirmCancelBtn: document.getElementById('confirmCancelBtn'),
            };
            const inputIds = ['clientName', 'reportDate', 'reportNumber', 'processNumber', 'companyAddress', 'companyPhone', 'companyEmail', 'boxCount', 'observations', 'conclusion', 'engineerName', 'creaNumber', 'clientAddress', 'signatureCity', 'signatureDate'];
            const checkboxIds = ['checkHumidity', 'checkGravel'];
            const fileInputIds = ['companyLogo', 'clientLogo', 'engineerSignature'];

            let fileList = [];
            let stream = null;
            let saveTimeout;

            // --- InicializaÃ§Ã£o ---
            function initialize() {
                document.getElementById('reportDate').valueAsDate = new Date();
                document.getElementById('signatureDate').valueAsDate = new Date();
                setupEventListeners();
                loadProgress(true); // Tenta carregar silenciosamente ao iniciar
            }

            // --- Event Listeners ---
            function setupEventListeners() {
                formElements.generateBtn.addEventListener('click', handleFormSubmit);
                formElements.downloadPdfBtn.addEventListener('click', downloadPDF);
                formElements.newReportBtn.addEventListener('click', handleNewReport);
                formElements.editReportBtn.addEventListener('click', handleEditReport);
                formElements.photosInput.addEventListener('change', handleFileSelect);
                formElements.cameraBtn.addEventListener('click', openCamera);
                formElements.closeCameraBtn.addEventListener('click', closeCamera);
                formElements.captureBtn.addEventListener('click', capturePhoto);
                formElements.saveBtn.addEventListener('click', () => saveProgress(true));
                formElements.loadBtn.addEventListener('click', () => loadProgress(false));
                formElements.reportForm.addEventListener('input', () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => saveProgress(false), 1000);
                });
            }

            // --- FunÃ§Ãµes de NotificaÃ§Ã£o e ConfirmaÃ§Ã£o ---
            function showNotification(message, isError = false) {
                const { notification, notificationMessage } = formElements;
                notificationMessage.textContent = message;
                notification.classList.remove('opacity-0', 'transform', 'translate-y-2');

                if (isError) {
                    notification.classList.remove('bg-green-500');
                    notification.classList.add('bg-red-500');
                } else {
                    notification.classList.remove('bg-red-500');
                    notification.classList.add('bg-green-500');
                }

                clearTimeout(window.notificationTimeout);
                window.notificationTimeout = setTimeout(() => {
                    notification.classList.add('opacity-0', 'transform', 'translate-y-2');
                }, 3000);
            }

            function customConfirm(message, onConfirm) {
                formElements.confirmMessage.textContent = message;
                formElements.confirmModal.classList.remove('hidden');

                const newOkBtn = formElements.confirmOkBtn.cloneNode(true);
                formElements.confirmOkBtn.parentNode.replaceChild(newOkBtn, formElements.confirmOkBtn);
                formElements.confirmOkBtn = newOkBtn;

                const newCancelBtn = formElements.confirmCancelBtn.cloneNode(true);
                formElements.confirmCancelBtn.parentNode.replaceChild(newCancelBtn, formElements.confirmCancelBtn);
                formElements.confirmCancelBtn = newCancelBtn;

                formElements.confirmOkBtn.addEventListener('click', () => {
                    formElements.confirmModal.classList.add('hidden');
                    onConfirm();
                });
                formElements.confirmCancelBtn.addEventListener('click', () => {
                    formElements.confirmModal.classList.add('hidden');
                });
            }

            // --- LÃ³gica de Salvamento e Carregamento ---
            async function saveProgress(isManual) {
                try {
                    const data = await getFormDataForSave();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    if (isManual) {
                        showNotification('Progresso salvo com sucesso!');
                    }
                } catch (error) {
                    console.error("Erro ao salvar progresso:", error);
                    showNotification('Erro ao salvar o progresso.', true);
                }
            }

            async function loadProgress(isSilent = false) {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (!savedData) {
                    if (!isSilent) showNotification('Nenhum progresso salvo encontrado.', true);
                    return;
                }
                const data = JSON.parse(savedData);

                inputIds.forEach(id => { if (data[id]) document.getElementById(id).value = data[id]; });
                checkboxIds.forEach(id => { if (data[id]) document.getElementById(id).checked = data[id]; });

                for (const id of fileInputIds) {
                    if (data[id]) {
                        const file = base64ToFile(data[id].base64, data[id].name, data[id].type);
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(file);
                        document.getElementById(id).files = dataTransfer.files;
                    }
                }

                if (data.photoFiles && data.photoFiles.length > 0) {
                    fileList = data.photoFiles.map(item => ({
                        file: base64ToFile(item.base64, `foto-salva-${Date.now()}.jpg`, 'image/jpeg'),
                        caption: item.caption
                    }));
                    updatePhotoPreviews();
                }
                if (!isSilent) showNotification('Progresso carregado com sucesso!');
            }

            async function getFormDataForSave() {
                const data = {};
                inputIds.forEach(id => data[id] = document.getElementById(id).value);
                checkboxIds.forEach(id => data[id] = document.getElementById(id).checked);

                const fileInputPromises = fileInputIds.map(async id => {
                    const file = document.getElementById(id).files[0];
                    if (file) {
                        data[id] = { name: file.name, type: file.type, base64: await fileToBase64(file) };
                    }
                });

                const photoFilesPromise = Promise.all(fileList.map(async (item) => ({
                    caption: item.caption,
                    base64: await fileToBase64(item.file)
                })));

                const [_, photoFiles] = await Promise.all([Promise.all(fileInputPromises), photoFilesPromise]);
                data.photoFiles = photoFiles;

                return data;
            }

            function handleNewReport() {
                customConfirm('Isso limparÃ¡ o formulÃ¡rio e o progresso salvo. Deseja continuar?', () => {
                    formElements.reportOutputContainer.classList.add('hidden');
                    formElements.formContainer.classList.remove('hidden');
                    formElements.reportForm.reset();
                    fileList = [];
                    updatePhotoPreviews();
                    localStorage.removeItem(STORAGE_KEY);
                    document.getElementById('reportDate').valueAsDate = new Date();
                    document.getElementById('signatureDate').valueAsDate = new Date();
                    showNotification('Novo relatÃ³rio iniciado.');
                });
            }

            function handleEditReport() {
                formElements.reportOutputContainer.classList.add('hidden');
                formElements.formContainer.classList.remove('hidden');
                window.scrollTo(0, 0);
            }

            // --- LÃ³gica da CÃ¢mera e Fotos ---
            async function handleFileSelect(event) {
                for (const file of event.target.files) {
                    try {
                        const resizedFile = await resizeImage(file, 1024, 1024, 0.8);
                        fileList.push({ file: resizedFile, caption: '' });
                    } catch (err) {
                        console.error("Erro ao redimensionar a imagem: ", err);
                        fileList.push({ file: file, caption: '' });
                    }
                }
                updatePhotoPreviews();
                saveProgress(false);
            }

            async function openCamera() {
                try {

            // --- FunÃ§Ãµes Auxiliares ---
            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    if (!file) resolve(null);
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                    reader.readAsDataURL(file);
                });
            }

            function base64ToFile(dataurl, filename, type) {
                const arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                    bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while (n--) { u8arr[n] = bstr.charCodeAt(n); }
                return new File([u8arr], filename, { type: mime || type });
            }

            function resizeImage(file, maxWidth, maxHeight, quality) {
                return new Promise((resolve, reject) => {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        canvas.toBlob(blob => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = (err) => reject(err);
                });
            }
