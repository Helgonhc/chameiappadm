<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .form-section {
            background-color: #ffffff;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .form-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111827;
            border-bottom: 1px solid #d1d5db;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 0.5rem;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f9fafb;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        /* Estilos do Relatório Gerado (Preview) */
        .report-page-container {
            width: 100%;
            max-width: 210mm;
            /* A4 width */
            margin: 1rem auto;
            page-break-after: always;
        }

        .report-page-container:last-of-type {
            page-break-after: auto;
        }

        .report-page {
            background: white;
            width: 100%;
            aspect-ratio: 210 / 297;
            /* Proporção A4 para o preview */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #e5e7eb;
            font-size: 11pt;
        }

        .report-header,
        .report-footer {
            padding: 8mm 10mm;
            flex-shrink: 0;
        }

        .report-header {
            border-bottom: 1px solid #d1d5db;
        }

        .report-footer {
            margin-top: auto;
            padding: 6mm 10mm;
            flex-shrink: 0;
        }

        .report-content {
            flex-grow: 1;
            padding: 10mm;
            overflow: hidden;
        }

        .report-section-title {
            font-size: 1.2em;
            font-weight: 700;
            color: #111827;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .report-content p,
        .report-content li {
            text-align: justify;
            line-height: 1.6;
        }

        .report-content table {
            width: 100%;
            font-size: 0.9em;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .report-content th,
        .report-content td {
            border: 1px solid #d1d5db;
            padding: 6px 8px;
            text-align: left;
            vertical-align: top;
        }

        .report-content th {
            background-color: #f3f4f6;
            font-weight: 600;
        }

        /* Classe especial para forçar dimensões corretas na hora de gerar o PDF */
        .pdf-render-mode .report-page-container {
            width: 794px !important;
            /* A4 width @ 96 DPI */
            height: 1123px !important;
            /* A4 height @ 96 DPI */
            margin: 0 !important;
            box-shadow: none !important;
            border: none !important;
        }

        .pdf-render-mode .report-page {
            width: 100% !important;
            height: 100% !important;
            aspect-ratio: unset !important;
        }

        @media print {
            body {
                background-color: #fff;
            }

            .no-print {
                display: none !important;
            }

            #reportOutputContainer {
                padding: 0;
            }

            .report-page-container {
                margin: 0;
                box-shadow: none;
                border: none;
            }

            .report-page {
                width: 210mm;
                height: 297mm;
                aspect-ratio: unset;
                box-shadow: none;
                border: none;
                font-size: 11pt;
                overflow: hidden;
            }
        }

        /* --- Patch de Responsividade --- */
        @media (max-width: 1024px) {

            .topbar-inner,
            .cover-top,
            .doc-head {
                flex-direction: column !important;
                display: flex !important;
                gap: 15px !important;
                text-align: center !important;
                padding: 20px !important;
                height: auto !important;
                grid-template-columns: 1fr !important;
            }

            .brand,
            .actions,
            .tabs {
                width: 100% !important;
                justify-content: center !important;
                min-width: unset !important;
            }

            .tabs {
                overflow-x: auto;
                padding: 10px 0;
            }

            .grid,
            .row,
            .row-3,
            .equip-details-grid,
            .grid-cols-2,
            .grid-cols-3,
            .grid-cols-4 {
                grid-template-columns: 1fr !important;
            }

            .wrap,
            .max-w-7xl,
            .max-w-5xl,
            .report-page-container {
                padding: 10px !important;
            }

            .meta-strip {
                grid-template-columns: 1fr 1fr !important;
                display: grid !important;
            }

            .meta-strip .m {
                border-right: none !important;
                border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            }
        }

        @media (max-width: 640px) {
            .meta-strip {
                grid-template-columns: 1fr !important;
            }

            .sheet,
            .report-page {
                width: 210mm !important;
            }

            #reportOutput,
            #previewPane,
            .preview-shell {
                overflow-x: auto !important;
                display: block !important;
                -webkit-overflow-scrolling: touch;
            }

            .cover-mid h1 {
                font-size: 20pt !important;
            }
        }
    </style>

    <script>
        // Protecao Anti-Copia ChameiApp
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const { jsPDF } = window.jspdf;

            // --- Elementos do DOM ---
            const reportForm = document.getElementById('reportForm');
            const reportOutput = document.getElementById('reportOutput');
            const reportOutputContainer = document.getElementById('reportOutputContainer');
            const downloadPdfBtn = document.getElementById('downloadPdfBtn');
            const addVisualItemBtn = document.getElementById('addVisualItemBtn');
            const visualItemsContainer = document.getElementById('visualItemsContainer');
            const visualItemTemplate = document.getElementById('visualItemTemplate');
            const addPhotoBtn = document.getElementById('addPhotoBtn');
            const photosContainer = document.getElementById('photosContainer');
            const photoTemplate = document.getElementById('photoTemplate');
            const addEquipmentBtn = document.getElementById('addEquipmentBtn');
            const equipmentsContainer = document.getElementById('equipmentsContainer');
            const equipmentTemplate = document.getElementById('equipmentTemplate');
            const saveProgressBtn = document.getElementById('saveProgressBtn');
            const importFileBtn = document.getElementById('importFileBtn');
            const importFileInput = document.getElementById('importFileInput');
            const clearFormBtn = document.getElementById('clearFormBtn');
            const statusMessage = document.getElementById('statusMessage');
            const escalaMedicaoSelect = document.getElementById('escalaMedicao');

            function getUnitFromScale(scaleString) {
                if (scaleString.includes('ÂµÎ©')) return 'ÂµÎ©';
                if (scaleString.includes('mÎ©')) return 'mÎ©';

                return 'ÂµÎ©';
            }

            function convertToMicroOhms(value, scaleString) {
                if (isNaN(value)) return NaN;
                if (scaleString.includes('mÎ©')) return value * 1000;
                if (scaleString.includes('Î©')) return value * 1000000;
                return value; // Assume ÂµÎ©
            }

            function addEquipment(data = {}) {
                const {
                    type = 'Disjuntor de Média Tensão PVO',
                    fabricante = '', modelo = '', ano = '', serie = '',
                    tensao = '', corrente = '', maxValue = '', r = '', s = '', t = '',
                    resultado = 'Satisfatório', reason = ''
                } = data;

                const templateContent = equipmentTemplate.content.cloneNode(true);
                const equipmentItem = templateContent.querySelector('.equipment-item');

                const correnteInput = equipmentItem.querySelector('.equipment-corrente');
                const maxValueInput = equipmentItem.querySelector('.equipment-max-value');

                equipmentItem.querySelector('.equipment-type').value = type;
                equipmentItem.querySelector('.equipment-fabricante').value = fabricante;
                equipmentItem.querySelector('.equipment-modelo').value = modelo;
                equipmentItem.querySelector('.equipment-ano').value = ano;
                equipmentItem.querySelector('.equipment-serie').value = serie;
                equipmentItem.querySelector('.equipment-tensao').value = tensao;
                correnteInput.value = corrente;
                maxValueInput.value = maxValue;
                equipmentItem.querySelector('.equipment-r').value = r;
                equipmentItem.querySelector('.equipment-s').value = s;
                equipmentItem.querySelector('.equipment-t').value = t;

                const statusSelect = equipmentItem.querySelector('.equipment-resultado');
                const reasonContainer = equipmentItem.querySelector('.reason-container');
                const reasonTextarea = equipmentItem.querySelector('.equipment-reason');

                statusSelect.value = resultado;
                reasonTextarea.value = reason;

                const toggleReasonField = () => {
                    if (statusSelect.value === 'Insatisfatório') {
                        reasonContainer.classList.remove('hidden');
                    } else {
                        reasonContainer.classList.add('hidden');
                    }
                };

                const validateResistance = () => {
                    const maxVal = parseFloat(maxValueInput.value);
                    const scale = escalaMedicaoSelect.value;

                    const rValRaw = parseFloat(equipmentItem.querySelector('.equipment-r').value);
                    const sValRaw = parseFloat(equipmentItem.querySelector('.equipment-s').value);
                    const tValRaw = parseFloat(equipmentItem.querySelector('.equipment-t').value);

                    const rVal = convertToMicroOhms(rValRaw, scale);
                    const sVal = convertToMicroOhms(sValRaw, scale);
                    const tVal = convertToMicroOhms(tValRaw, scale);

                    let isUnsatisfactory = false;

                    // 1. Check against max value
                    if (!isNaN(maxVal)) {
                        if ((!isNaN(rVal) && rVal > maxVal) ||
                            (!isNaN(sVal) && sVal > maxVal) ||
                            (!isNaN(tVal) && tVal > maxVal)) {
                            isUnsatisfactory = true;
                        }
                    }

                    // 2. Check for 20% variation between phases
                    const measuredValues = [rVal, sVal, tVal].filter(v => !isNaN(v) && v > 0);
                    if (measuredValues.length === 3) {
                        const min = Math.min(...measuredValues);
                        const max = Math.max(...measuredValues);
                        if (min > 0) { // Avoid division by zero
                            const variation = ((max - min) / min);
                            if (variation > 0.20) {
                                isUnsatisfactory = true;
                            }
                        }
                    }

                    if (isUnsatisfactory) {
                        statusSelect.value = 'Insatisfatório';
                    } else {
                        if (statusSelect.value !== 'Não se aplica') {
                            statusSelect.value = 'Satisfatório';
                        }
                    }
                    toggleReasonField();
                };

                correnteInput.addEventListener('input', () => {
                    const currentVal = parseFloat(correnteInput.value);
                    if (!isNaN(currentVal)) {
                        maxValueInput.value = currentVal > 1250 ? '200' : '100';
                    }
                });

                equipmentItem.querySelectorAll('.equipment-max-value, .equipment-r, .equipment-s, .equipment-t').forEach(input => {
                    input.addEventListener('input', validateResistance);
                });

                statusSelect.addEventListener('change', toggleReasonField);

                // Set initial state
                toggleReasonField();
                updateAllEquipmentUnits(); // Update placeholders for the new item

                equipmentItem.querySelector('.remove-equipment-btn').addEventListener('click', () => {
                    equipmentItem.remove();
                    updateAndRender();
                });

                equipmentsContainer.appendChild(equipmentItem);
            }

            async function fileToDataURL(file) {
                return new Promise((resolve) => {
                    if (!file) { resolve(null); return; }
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(file);
                });
            }

            async function pdfToDataURLs(file) {
                return new Promise(async (resolve) => {
                    if (!file) { resolve([]); return; }
                    const fileReader = new FileReader();
                    fileReader.onload = async function () {
                        try {
                            const typedarray = new Uint8Array(this.result);
                            const pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                            const pageDataUrls = [];
                            for (let i = 1; i <= pdfDoc.numPages; i++) {
                                const page = await pdfDoc.getPage(i);
                                const viewport = page.getViewport({ scale: 2.0 });
                                const canvas = document.createElement('canvas');
                                const context = canvas.getContext('2d');
                                canvas.height = viewport.height;
                                canvas.width = viewport.width;
                                await page.render({ canvasContext: context, viewport: viewport }).promise;
                                pageDataUrls.push(canvas.toDataURL('image/png'));
                            }
                            resolve(pageDataUrls);
                        } catch (error) {
                            console.error("Erro ao processar PDF:", error);
                            resolve([]);
                        }
                    };
                    fileReader.readAsArrayBuffer(file);
                });
            }

            async function processFile(file) {
                if (!file) return [];
                if (file.type.startsWith('image/')) {
                    const dataUrl = await fileToDataURL(file);
                    return dataUrl ? [dataUrl] : [];
                }
                if (file.type === 'application/pdf') {
                    return pdfToDataURLs(file);
                }
                return [];
            }

                const phoneIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 inline-block mr-1.5" viewBox="0 0 20 20" fill="currentColor"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path></svg>`;
                const emailIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 inline-block mr-1.5" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path></svg>`;
                const addressIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 inline-block mr-1.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>`;

                return `
                <div class="report-footer text-[8pt] text-gray-600">
                    <div class="w-full h-0.5 bg-gray-300 mb-3"></div>
                    <div class="flex justify-between items-start">
                        <div class="w-1/2 pr-4">
                            <p class="font-bold text-gray-800 text-[9pt]">${data.companyName}</p>
                            <p class="mt-1 flex items-start">${addressIcon} <span class="ml-1">${data.companyAddress}</span></p>
                        </div>
                        <div class="w-1/2 text-right">
                            <p class="flex items-center justify-end">${phoneIcon} ${data.companyPhone}</p>
                            <p class="mt-1 flex items-center justify-end">${emailIcon} ${data.companyEmail}</p>
                        </div>
                    </div>
                </div>`;
            }

            async function updateAndRender() {
                const formData = await getFormData();
                const pages = createReportPages(formData);
                reportOutput.innerHTML = '';
                pages.forEach(page => reportOutput.appendChild(page));
            }

            async function downloadPDF() {
                const downloadBtnText = document.getElementById('downloadBtnText');
                const originalText = downloadBtnText.textContent;
                downloadPdfBtn.disabled = true;
                downloadBtnText.textContent = 'Processando...';

                // Adiciona a classe para forçar as dimensões corretas para o render
                reportOutputContainer.classList.add('pdf-render-mode');

                const pages = reportOutput.querySelectorAll('.report-page-container');
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = 210;
                const pdfHeight = 297;

                try {
                    for (let i = 0; i < pages.length; i++) {
                        const page = pages[i];
                        const canvas = await html2canvas(page, {
                            scale: 3,
                            useCORS: true,
                            logging: false,
                            width: 794,
                            height: 1123
                        });
                        if (i > 0) pdf.addPage();
                        const imgData = canvas.toDataURL('image/jpeg', 0.9);
                        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                    }
                    const reportNumber = document.getElementById('reportNumber').value || 'laudo-cabine-primaria';
                    pdf.save(`${reportNumber}.pdf`);
                } catch (error) {
                    console.error("Erro ao gerar PDF:", error);
                    alert(`Ocorreu um erro ao gerar o PDF. Verifique o console para mais detalhes.`);
                } finally {
                    // Remove a classe para restaurar o preview, ocorrendo erro ou não
                    reportOutputContainer.classList.remove('pdf-render-mode');
                    downloadPdfBtn.disabled = false;
                    downloadBtnText.textContent = originalText;
                }
            }

            function showStatus(message, isSuccess = true) {
                const statusMessage = document.getElementById('statusMessage');
                statusMessage.textContent = message;
                statusMessage.className = `text-center mb-4 h-6 ${isSuccess ? 'text-green-600' : 'text-red-600'}`;
                setTimeout(() => {
                    statusMessage.textContent = '';
                }, 3000);
            }

            async function saveProgress() {
                try {
                    const dataToSave = await getFormData(true);
                    const dataString = JSON.stringify(dataToSave, null, 2);
                    const blob = new Blob([dataString], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const reportNumber = document.getElementById('reportNumber').value || 'dados-laudo';
                    a.href = url;
                    a.download = `${reportNumber}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showStatus('Dados baixados com sucesso!', true);
                } catch (error) {
                    console.error("Erro ao baixar dados:", error);
                    showStatus('Falha ao baixar os dados.', false);
                }
            }

            function populateForm(savedData) {
                if (!savedData) {
                    showStatus('Dados inválidos para importação.', false);
                    return;
                }
                try {
                    clearForm(false);

                    Object.keys(savedData).forEach(key => {
                        const el = document.getElementById(key);
                        if (el && typeof savedData[key] === 'string' && !el.type.startsWith('file')) {
                            el.value = savedData[key];
                        }
                    });

                    if (savedData.companyLogoUrl) document.getElementById('companyLogo').__src = savedData.companyLogoUrl;
                    if (savedData.engineerSignatureUrl) document.getElementById('engineerSignature').__src = savedData.engineerSignatureUrl;
                    if (savedData.artUrls) document.getElementById('artPdf').__src = savedData.artUrls;

                    if (savedData.visualItems && Array.isArray(savedData.visualItems)) {
                        savedData.visualItems.forEach(itemData => addVisualItem(itemData));
                    }
                    if (savedData.equipments && Array.isArray(savedData.equipments)) {
                        savedData.equipments.forEach(eqData => addEquipment(eqData));
                    }
                    if (savedData.photos && Array.isArray(savedData.photos)) {
                        savedData.photos.forEach(photoData => addPhoto(photoData));
                    }

                    showStatus('Dados importados com sucesso!', true);
                    updateAndRender();
                } catch (error) {
                    console.error("Erro ao popular formulário:", error);
                    showStatus('Falha ao importar. Verifique o formato do arquivo.', false);
                }
            }

            function handleFileImport(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        populateForm(data);
                    } catch (error) {
                        console.error("Erro ao ler o arquivo JSON:", error);
                        showStatus('Arquivo inválido. Selecione um arquivo JSON gerado por esta aplicação.', false);
                    }
                };
                reader.readAsText(file);
                // Reset file input to allow re-uploading the same file
                event.target.value = '';
            }

            function addInitialItems() {
                const initialItems = ["Luvas para alta tensão", "Vara de manobra elétrica", "Iluminação Subestação Primária", "Iluminação de emergência Subestação Primária", "Estrado de borracha", "Tomadas/iluminação", "Extintor de incêndio"];
                initialItems.forEach(item => addVisualItem({ description: item }));
                addPhoto();
                addEquipment();
                document.getElementById('reportDate').valueAsDate = new Date();
                document.getElementById('signatureDate').valueAsDate = new Date();
            }

            function clearForm(confirmFirst = true) {
                if (confirmFirst && !confirm('Tem certeza que deseja limpar todo o formulário?')) {
                    return;
                }
                reportForm.reset();
                visualItemsContainer.innerHTML = '';
                photosContainer.innerHTML = '';
                equipmentsContainer.innerHTML = '';

                addInitialItems();

                updateAndRender();
                if (confirmFirst) {
                    showStatus('Formulário limpo.', true);
                }
            }

            // --- Inicialização do script ---
            addInitialItems();
            updateAndRender();

            // --- Event Listeners ---
            reportForm.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(updateAndRender, 500);
            });
            reportForm.addEventListener('change', updateAndRender);
            addVisualItemBtn.addEventListener('click', () => addVisualItem());
            addPhotoBtn.addEventListener('click', () => addPhoto());
            addEquipmentBtn.addEventListener('click', () => addEquipment());
            downloadPdfBtn.addEventListener('click', downloadPDF);
            saveProgressBtn.addEventListener('click', saveProgress);
            importFileBtn.addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', handleFileImport);
            clearFormBtn.addEventListener('click', () => clearForm(true));
            escalaMedicaoSelect.addEventListener('change', updateAllEquipmentUnits);

            // --- Sincronização de Rolagem ---
            const formScroller = document.getElementById('formContainer');
            const previewScroller = document.getElementById('reportOutput');

            formScroller.addEventListener('scroll', () => {
                const formScrollableHeight = formScroller.scrollHeight - formScroller.clientHeight;
                if (formScrollableHeight <= 0) return;

                const scrollPercent = formScroller.scrollTop / formScrollableHeight;
                const previewScrollableHeight = previewScroller.scrollHeight - previewScroller.clientHeight;

                previewScroller.scrollTop = scrollPercent * previewScrollableHeight;
            });
        });
    </script>
</body>

</html>
